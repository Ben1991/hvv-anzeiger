# Optional Home Assistant transport for the dual-USB CYD ESP32-2432S028 with
# ILI9342 display.
substitutions:
  name: hvv-cyd-ha
  friendly_name: HVV-Anzeiger
  board_entity: sensor.hvv_board
  display_model: ESP32-2432S028-9342
  display_rotation: '90'
  display_color_order: rgb

packages:
  core: !include packages/core.yaml
  transport: !include packages/home-assistant.yaml
  hardware: !include boards/cyd.yaml
