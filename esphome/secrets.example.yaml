wifi_ssid: REPLACE_WITH_WIFI_SSID
wifi_password: REPLACE_WITH_WIFI_PASSWORD
# Generate your own 32-byte base64 key, e.g. ESPHome Device Builder's API dialog.
api_encryption_key: REPLACE_WITH_YOUR_OWN_32_BYTE_BASE64_KEY
# The Pi installer publishes this fixed mDNS name on the local network.
# Used only by the legacy hvv-direct profile, not by hvv-cyd.
backend_url: https://hvv-anzeiger.local:8080/api/esphome
backend_authorization: Bearer REPLACE_WITH_CYD_API_KEY
# Stored as C++ string literals so the credentials can be used for Geofox HMAC.
# Run the setup script to enter them safely; do not paste real values here.
geofox_user_cpp: '""'
geofox_password_cpp: '""'
