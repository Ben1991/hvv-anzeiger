# ESP32-2432S028 dual-USB CYD, 2.8-inch 240x320 ILI9342 display. Fetches data
# directly from the HVV backend, so Home Assistant is not required.
substitutions:
  name: hvv-cyd
  friendly_name: HVV CYD
  display_model: ESP32-2432S028-9342
  display_rotation: '0'
  display_color_order: rgb

packages:
  core: !include packages/core.yaml
  transport: !include packages/https.yaml
  hardware: !include boards/cyd.yaml
