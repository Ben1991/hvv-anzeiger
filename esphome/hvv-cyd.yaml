# ESP32-2432S028 CYD, 2.8-inch 240x320 display. Fetches data directly from the
# HVV backend, so Home Assistant is not required for the display.
substitutions:
  name: hvv-cyd
  friendly_name: HVV CYD
  display_model: ILI9341
  display_rotation: '90'
  display_color_order: rgb

packages:
  core: !include packages/core.yaml
  transport: !include packages/https.yaml
  hardware: !include boards/cyd.yaml
