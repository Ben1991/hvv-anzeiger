# ESP32-2432S028 CYD, 2.8-inch 240x320 display, dual USB revision shown in
# the supplied product photos. The listing specifies an ILI9341 controller.
substitutions:
  name: hvv-cyd
  friendly_name: HVV CYD
  board_entity: sensor.hvv_board
  display_model: ILI9341
  display_rotation: '90'
  display_color_order: rgb

packages:
  core: !include packages/core.yaml
  transport: !include packages/home-assistant.yaml
  hardware: !include boards/cyd.yaml
