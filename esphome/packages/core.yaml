globals:
  - id: hvv_display_enabled
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: hvv_blanked
    type: bool
    initial_value: 'false'
switch:
  - platform: template
    name: Anzeige
    id: hvv_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - globals.set:
          id: hvv_display_enabled
          value: 'true'
    turn_off_action:
      - globals.set:
          id: hvv_display_enabled
          value: 'false'

button:
  - platform: restart
    name: Neustart

sensor:
  - platform: debug
    free:
      name: Freier Heap
      entity_category: diagnostic
    block:
      name: Größter freier Heap-Block
      entity_category: diagnostic
    min_free:
      name: Minimaler freier Heap
      entity_category: diagnostic
  - platform: wifi_signal
    name: WLAN Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Verbindung
  - platform: template
    name: Abfahrtsdaten veraltet
    device_class: problem
    lambda: return hvv_board.has_problem(millis());

interval:
  - interval: 1s
    then:
      - lambda: |-
          const auto now = id(hvv_clock).now();
          hvv_board.tick(millis(), now.is_valid() ? now.timestamp : 0,
                         now.is_valid() ? now.strftime("%H:%M").c_str() : nullptr);
          const bool active = id(hvv_display_enabled) && !hvv_board.night(millis());
          if (id(hvv_blanked) == !active) return;
          id(hvv_blanked) = !active;
          auto call = id(hvv_backlight).make_call();
          call.set_state(active);
          call.set_transition_length(0);
          call.perform();
