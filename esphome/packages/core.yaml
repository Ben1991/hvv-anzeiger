esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1
  includes:
    - hvv_board.h

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # Preserve the cached display when Home Assistant is temporarily offline.
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

json:

font:
  - file: gfonts://Roboto
    id: hvv_font
    size: 16
    glyphs: &hvv_glyphs " !\"%&'()+,-./0123456789:;=?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÄÖÜäöüß–…"
  - file: gfonts://Roboto
    id: hvv_small_font
    size: 12
    glyphs: *hvv_glyphs

globals:
  - id: hvv_display_enabled
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: hvv_blanked
    type: bool
    initial_value: 'false'

switch:
  - platform: template
    name: Anzeige
    id: hvv_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - globals.set:
          id: hvv_display_enabled
          value: 'true'
    turn_off_action:
      - globals.set:
          id: hvv_display_enabled
          value: 'false'

button:
  - platform: restart
    name: Neustart

sensor:
  - platform: wifi_signal
    name: WLAN Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: Verbindung
  - platform: template
    name: Abfahrtsdaten veraltet
    device_class: problem
    lambda: return hvv_board.has_problem(millis());

interval:
  - interval: 1s
    then:
      - lambda: |-
          const auto now = id(hvv_clock).now();
          hvv_board.tick(millis(), now.is_valid() ? now.timestamp : 0);
          const bool active = id(hvv_display_enabled) && !hvv_board.night(millis());
          if (id(hvv_blanked) == !active) return;
          id(hvv_blanked) = !active;
          auto call = id(hvv_backlight).make_call();
          call.set_state(active);
          call.set_transition_length(0);
          call.perform();
