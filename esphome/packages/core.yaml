esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1
  on_boot:
    priority: 800
    then:
      - lambda: |-
          hvv::board_fonts.regular[10] = id(hvv_small_font);
          hvv::board_fonts.regular[13] = id(hvv_regular_13);
          hvv::board_fonts.regular[14] = id(hvv_regular_14);
          hvv::board_fonts.regular[15] = id(hvv_regular_15);
          hvv::board_fonts.regular[16] = id(hvv_regular_16);
          hvv::board_fonts.regular[17] = id(hvv_regular_17);
          hvv::board_fonts.regular[18] = id(hvv_font);
          hvv::board_fonts.bold[8] = id(hvv_bold_8);
          hvv::board_fonts.bold[9] = id(hvv_bold_9);
          hvv::board_fonts.bold[10] = id(hvv_bold_10);
          hvv::board_fonts.bold[11] = id(hvv_bold_11);
          hvv::board_fonts.bold[12] = id(hvv_bold_12);
          hvv::board_fonts.bold[13] = id(hvv_bold_13);
          hvv::board_fonts.bold[14] = id(hvv_bold_14);
          hvv::board_fonts.bold[15] = id(hvv_bold_15);
          hvv::board_fonts.bold[16] = id(hvv_bold_16);
          hvv::board_fonts.bold[17] = id(hvv_bold_17);
          hvv::board_fonts.bold[18] = id(hvv_bold_18);
          hvv::board_fonts.bold[19] = id(hvv_bold_19);
          hvv::board_fonts.bold[20] = id(hvv_bold_20);
          hvv::board_fonts.bold[21] = id(hvv_bold_21);
          hvv::board_fonts.bold[22] = id(hvv_bold_22);
          hvv::board_fonts.bold[25] = id(hvv_bold_25);
  includes:
    - hvv_board.h
    - hvv_geofox.h

logger:

api:
  encryption:
    key: !secret api_encryption_key
  # Preserve the cached display when Home Assistant is temporarily offline.
  reboot_timeout: 0s

mdns:
  disabled: false

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

