name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esphome:
    name: ESPHome ${{ matrix.firmware }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firmware: [hvv-display.yaml, hvv-cyd.yaml, hvv-s3-ili9488.yaml, hvv-direct.yaml]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome==2026.9.1
      - name: Validate all profiles and compile firmware
        run: python scripts/check_esphome.py --compile ${{ matrix.firmware }}
      - name: Check Home Assistant package templates
        if: matrix.firmware == 'hvv-display.yaml'
        run: python scripts/check_home_assistant.py
      - name: Install ArduinoJson for host protocol tests
        if: matrix.firmware == 'hvv-display.yaml'
        run: git clone --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git /tmp/arduinojson
      - name: Run ESP32 display logic on host
        if: matrix.firmware == 'hvv-display.yaml'
        run: |
          python tests/firmware/make_snapshot.py /tmp/hvv-snapshot.json
          g++ -std=c++17 -Wall -Wextra -Werror -I tests/firmware -I /tmp/arduinojson/src tests/firmware/test_board.cpp -o /tmp/test-board
          /tmp/test-board /tmp/hvv-snapshot.json

  backend-container:
    name: Backend container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build backend without GPIO dependencies
        run: docker build -t hvv-backend .
      - name: Validate Compose configuration
        run: |
          mkdir -p data
          touch data/web.env
          docker compose config --quiet
      - name: Check backend imports and CLI
        run: docker run --rm hvv-backend python -m hvv_display.web --help
      - name: Exercise Compose installation and recreate with private files
        run: python3 tests/container_smoke.py

  tests:
    name: Python 3.11 tests and quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Compile Python sources
        run: python -m compileall -q hvv_display tests

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Run Ruff
        run: ruff check .

      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements.txt --disable-pip

      - name: Build package
        run: python -m build --no-isolation

      - name: Render display preview on primary version
        run: hvv-preview /tmp/hvv-anzeiger-preview.png

  shell:
    name: Shell installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Bash syntax
        run: bash -n install.sh update.sh configure-credentials.sh configure-web.sh diagnose.sh

      - name: Run ShellCheck
        run: shellcheck install.sh update.sh configure-credentials.sh configure-web.sh diagnose.sh tests/install-smoke.sh

      - name: Run transactional installer smoke test
        run: tests/install-smoke.sh

      - name: Verify systemd units
        run: |
          sudo install -d /opt/hvv-anzeiger/.venv/bin
          sudo ln -s /usr/bin/python3 /opt/hvv-anzeiger/.venv/bin/python
          systemd-analyze verify \
            systemd/hvv-anzeiger.service \
            systemd/hvv-anzeiger-web.service \
            systemd/hvv-anzeiger-log-cleanup.service \
            systemd/hvv-anzeiger-log-cleanup.timer

  browser:
    name: Browser smoke and visual regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Install browser test dependencies
        run: |
          npm ci --prefix browser
          npm audit --audit-level=high --prefix browser
          browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Start local web application
        run: |
          python -m hvv_display.web \
            --host 127.0.0.1 \
            --port 18080 \
            --config browser/fixtures/config-filtered.json \
            --cache /tmp/hvv-anzeiger-stations.json > /tmp/hvv-anzeiger-web.log 2>&1 &
          echo $! > /tmp/hvv-anzeiger-web.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/ > /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Run browser smoke and visual regression
        run: npm test --prefix browser

      - name: Show web log on failure
        if: failure()
        run: cat /tmp/hvv-anzeiger-web.log

      - name: Upload browser report and accessibility screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-accessibility-report
          path: |
            browser/playwright-report/
            browser/test-results/
          retention-days: 7
