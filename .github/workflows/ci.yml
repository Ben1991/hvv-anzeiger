name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 tests and quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --require-hashes --requirement requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Compile Python sources
        run: python -m compileall -q hvv_display tests

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Run Ruff
        run: ruff check .

      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements.txt --disable-pip

      - name: Build package
        run: python -m build --no-isolation

      - name: Render display preview on primary version
        run: hvv-preview /tmp/hvv-anzeiger-preview.png

  shell:
    name: Shell installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Bash syntax
        run: bash -n install.sh configure-credentials.sh diagnose.sh

      - name: Run ShellCheck
        run: shellcheck install.sh configure-credentials.sh diagnose.sh tests/install-smoke.sh

      - name: Run transactional installer smoke test
        run: tests/install-smoke.sh

      - name: Verify systemd units
        run: |
          sudo install -d /opt/hvv-anzeiger/.venv/bin
          sudo ln -s /usr/bin/python3 /opt/hvv-anzeiger/.venv/bin/python
          systemd-analyze verify \
            systemd/hvv-anzeiger.service \
            systemd/hvv-anzeiger-web.service \
            systemd/hvv-anzeiger-log-cleanup.service \
            systemd/hvv-anzeiger-log-cleanup.timer
