<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="title description">
  <title id="title">Mockup: abgelaufener Abfahrtsstand in der Weboberfläche</title>
  <desc id="description">Das Dashboard blendet abgelaufene Abfahrten aus und zeigt Alter, letzten Abruf und die Zeit bis zum nächsten Versuch.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#192b45"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1120" height="640" rx="26" fill="url(#background)"/>
  <text x="52" y="58" fill="#8fcfff" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" letter-spacing="2">HVV-ANZEIGER · MOCKUP 02</text>
  <g filter="url(#shadow)">
    <rect x="52" y="86" width="1016" height="500" rx="20" fill="#0b111c" stroke="#35465f"/>
    <text x="88" y="139" fill="#f4f7fb" font-family="system-ui,Segoe UI,sans-serif" font-size="31" font-weight="760">Abfahrten</text>
    <text x="88" y="166" fill="#aab8cb" font-family="system-ui,Segoe UI,sans-serif" font-size="15">Lokale HVV-Anzeige · aktualisiert beim Öffnen</text>
    <text x="805" y="147" fill="#8bd3ff" font-family="system-ui,Segoe UI,sans-serif" font-size="15">Displaymodus</text>
    <text x="924" y="147" fill="#8bd3ff" font-family="system-ui,Segoe UI,sans-serif" font-size="15">Einstellungen</text>
    <rect x="88" y="195" width="944" height="52" rx="10" fill="#4b2027" stroke="#ff727b"/>
    <circle cx="115" cy="221" r="8" fill="#ff727b"/>
    <text x="137" y="227" fill="#fff1f2" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="750">Geofox nicht erreichbar · gespeicherte Abfahrten werden nicht mehr angezeigt.</text>
    <text x="90" y="282" fill="#ff9aa5" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="800">DATEN VERALTET</text>
    <text x="90" y="314" fill="#dbe4f1" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Letzter erfolgreicher Abruf: 14.11.2026, 08:42:00 · Datenalter: 6 Minuten</text>
    <text x="90" y="342" fill="#dbe4f1" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Nächster Versuch in 24 Sekunden.</text>
    <rect x="88" y="371" width="944" height="126" rx="13" fill="#080c12" stroke="#35445a"/>
    <text x="560" y="423" text-anchor="middle" fill="#edf2f8" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700">Letzter Stand zu alt</text>
    <text x="560" y="456" text-anchor="middle" fill="#aab8cb" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Abfahrten ausgeblendet · automatische Aktualisierung läuft weiter</text>
    <g>
      <rect x="88" y="519" width="296" height="44" rx="9" fill="#121c2d" stroke="#324057"/>
      <rect x="400" y="519" width="296" height="44" rx="9" fill="#121c2d" stroke="#324057"/>
      <rect x="712" y="519" width="320" height="44" rx="9" fill="#121c2d" stroke="#324057"/>
      <text x="108" y="546" fill="#aab8cb" font-family="system-ui,Segoe UI,sans-serif" font-size="14">CPU</text><text x="342" y="546" text-anchor="end" fill="#e7edf5" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">12% Auslastung</text>
      <text x="420" y="546" fill="#aab8cb" font-family="system-ui,Segoe UI,sans-serif" font-size="14">RAM</text><text x="654" y="546" text-anchor="end" fill="#e7edf5" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">40% belegt</text>
      <text x="732" y="546" fill="#aab8cb" font-family="system-ui,Segoe UI,sans-serif" font-size="14">SD-Speicher</text><text x="1010" y="546" text-anchor="end" fill="#e7edf5" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">80% frei</text>
    </g>
  </g>
</svg>
