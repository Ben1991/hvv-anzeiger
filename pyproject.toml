[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvv-anzeiger"
version = "0.1.0"
description = "HVV departure display for a Raspberry Pi and ILI9341 TFT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "luma.lcd>=2.11,<3",
  "Pillow>=10,<12",
  "RPi.GPIO>=0.7.1; sys_platform == 'linux' and (platform_machine == 'armv7l' or platform_machine == 'aarch64')",
  "spidev>=3.6; sys_platform == 'linux' and (platform_machine == 'armv7l' or platform_machine == 'aarch64')",
]

[project.optional-dependencies]
test = [
  "build>=1,<2",
  "coverage[toml]>=7.6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
hvv-anzeiger = "hvv_display.main:main"
hvv-preview = "hvv_display.preview:main"

[tool.setuptools.packages.find]
include = ["hvv_display*"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["hvv_display"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == [\"']__main__[\"']:",
]
